# Avvio: cp deploy/.env.example deploy/.env (e compilarlo), poi
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  posa:
    build: ..
    env_file: .env
    environment:
      POSA_PROXY_FIDATO: "1"   # l'IP del cliente arriva da Caddy (X-Forwarded-For)
    volumes:
      - dati:/dati
    read_only: true           # il codice non è modificabile nemmeno se compromesso
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g
    pids_limit: 512
    restart: unless-stopped
    expose: ["8000"]          # raggiungibile solo da Caddy, non da internet

  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      POSA_DOMINIO: ${POSA_DOMINIO}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  dati:
  caddy_data:

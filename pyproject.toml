[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "posa"
version = "0.1.0"
description = "Sistema multiagente che posa pavimenti e rivestimenti a parete nella foto del cliente, senza toccare un pixel fuori dalla superficie. Servizio multi-cliente (SaaS)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "opencv-python-headless>=4.10",
    "pillow-heif>=0.18",
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]
# segmentazione automatica (UperNet-ConvNeXt, MIT). PyTorch CPU va installato prima con:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
segmentazione = ["torch>=2.2", "transformers>=4.40"]
# servizio per i negozi Shopify. Pillow 13 corregge decine di vulnerabilità nei decoder
# di immagini (le foto arrivano da sconosciuti): NON installarlo insieme a "demo".
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "pillow>=13.0.0"]
# interfaccia di demo (Gradio). Gradio richiede ancora Pillow < 13: solo uso interno,
# protetta da POSA_WEB_PASSWORD, mai esposta ai clienti.
demo = ["gradio>=5.0"]

[project.scripts]
posa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.catalog" = ["data/*.json", "data/textures/*.png"]
"app.server" = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: chiama i modelli veri (serve una chiave API, a pagamento)"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
exclude = ["tools/pentest.py"]

[tool.ruff.lint.per-file-ignores]
# script d'attacco: una riga per prova, più leggibile così
"tools/pentest.py" = ["E501", "E701", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

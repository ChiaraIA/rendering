[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "posa"
version = "0.1.0"
description = "Posa un materiale da catalogo su una superficie di una foto, senza toccare un pixel fuori maschera."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]   # M5
hdr = ["tifffile>=2024.8"]                   # M3 (16 bit)

[project.scripts]
posa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.catalog" = ["data/*.json", "data/textures/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

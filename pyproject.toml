[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "posa"
version = "0.1.0"
description = "Sistema multiagente che posa il pavimento scelto dal cliente nella foto della sua stanza, senza toccare un pixel fuori dal pavimento."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "opencv-python-headless>=4.10",
    "pillow-heif>=0.18",
    "claude-agent-sdk>=0.2",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
posa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.catalog" = ["data/*.json", "data/textures/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: chiama i modelli veri (serve una chiave API, a pagamento)"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
